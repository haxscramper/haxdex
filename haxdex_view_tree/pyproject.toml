[project]
name = "haxdex_view_tree"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beartype",
    "duckdb",
    "duckdb-engine",
    "loguru",
    "pydantic>=2",
    "sqlalchemy>=2",
    "hstd_py_qt",
    "haxdex_action",
    "haxdex_core",
    "haxdex_read_media",
    "haxdex_cli",
    "haxdex_view_results",
    "jedi",
    "hstd_py_lib",
    "hypothesis",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-xdist",
  "pytest-reportlog",
  "pytest-cov",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/haxdex_view_tree"]
