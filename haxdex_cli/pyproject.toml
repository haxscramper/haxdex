[project]
name = "haxdex_cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "beartype",
    "duckdb",
    "duckdb-engine",
    "loguru",
    "pydantic>=2",
    "sqlalchemy>=2",
    "haxdex_core",
    "haxdex_read_media",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/haxdex_cli"]
