[project]
name = "haxdex"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "haxscramper", email = "haxscramper@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "commentjson>=0.9.0",
    # haxorg wheels
    "hstd_py_lib",
    # editable local dependencies
    "haxdex_core",
    "haxdex_read_media",
    "haxdex_view_tree",
    "haxdex_view_generation",
    "hstd_py_qt",
    "haxdex_read_code_tsitter",
    "haxdex_cli",
    "haxdex_action",
    "haxdex_read_logs",
]

[project.scripts]
index-service = "haxdex:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "--strict-markers --tb=short -v"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.isort]
profile = "google"
force_single_line = false
force_sort_within_sections = true
combine_as_imports = true
multi_line_output = 3
line_length = 90
include_trailing_comma = true


[tool.uv.workspace]
members = [
    "haxdex_core",
    "haxdex_read_media",
    "haxdex_view_tree",
    "haxdex_view_generation",
    "hstd_py_qt",
    "haxdex_read_code_tsitter",
    "haxdex_cli",
    "haxdex_action",
    "haxdex_read_logs",
]

[tool.uv.sources]
haxdex_core = { workspace = true }
haxdex_read_media = { workspace = true }
haxdex_view_tree = { workspace = true }
haxdex_view_generation = { workspace = true }
hstd_py_qt = { workspace = true }
haxdex_read_code_tsitter = { workspace = true }
haxdex_cli = { workspace = true }
haxdex_action = { workspace = true }
haxdex_read_logs = { workspace = true }


hstd_py_lib = { path = "../../haxorg/dist/hstd_py_lib-0.1.0-py3-none-any.whl" }

[tool.ruff.lint]
ignore = [
  "F405",
  "F403",
  "E501",
  "F841",
  "F522",
  "F401",
  "E712",
  "C408",
  "B008",
  "RUF012",
  "RUF009",
  "UP035",
  "PYI029", # defining `__repr__` in stub
  "FLY002", # do not flag `"\n".join(["literal", "literal"])`
  "UP032", # do not flag `format()`
  "DTZ006",
  "UP045",
  "SIM117", # combine `with`
  "UP006", # List -> list
  "B006", # no, I don't want to write endless boilerplate slop around
         # every single function argument that is a list, tuple, set, dict
         # etc.
]
