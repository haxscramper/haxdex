[project]
name = "haxdex"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "haxscramper", email = "haxscramper@gmail.com" }]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
index-service = "haxdex:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "--strict-markers --tb=short -v"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.isort]
profile = "google"
force_single_line = false
force_sort_within_sections = true
combine_as_imports = true
multi_line_output = 3
line_length = 90
include_trailing_comma = true


[tool.uv.workspace]
members = [
    "haxdex_core",
    "haxdex_read_media",
]

[tool.uv.sources]
haxdex_core = { workspace = true }
haxdex_read_media = { workspace = true }
