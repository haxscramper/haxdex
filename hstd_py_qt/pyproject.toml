[project]
name = "hstd_py_qt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beartype",
    "duckdb",
    "duckdb-engine",
    "loguru",
    "pydantic>=2",
    "sqlalchemy>=2",
    "PyQt6",
    "PyQt6-QScintilla",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-xdist",
  "pytest-reportlog",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/hstd_py_qt"]
