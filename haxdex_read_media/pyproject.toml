[project]
name = "haxdex_read_media"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "beartype",
  "duckdb",
  "duckdb-engine",
  "loguru",
  "pydantic>=2",
  "sqlalchemy>=2",
  "haxdex_core",
  "semchunk",
  "tiktoken",
  "python-magic",
  "Pillow",
  "imagehash",
  "pymupdf",
  "docling",
  "pymupdf4llm",
  "flax",
  "jax[rocm7-local]",
  "einops",
  "openai",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/haxdex_read_media"]
